# Tool version outputs used by the mt-toolchain parser tests.
#
# Every table records where its text came from in `source`:
#   - "captured ...": produced by running the real tool.
#   - "representative: ...": taken from the format described in
#     01-RESEARCH.md ("Version commands and parse targets"); the real output
#     could not be produced in a Docker-less session. A CI capture (plan 01-07)
#     replaces each representative entry.

