# Single source of truth for every pin of the toolchain container (CONTEXT D-14).
#
# The Dockerfile receives these values only as build arguments rendered by
# `mt toolchain build-args`; `mt toolchain check` judges the live tools against
# them; the manifest records them. Nothing else pins a version. The one
# exception is the commit SHA of each GitHub Action in .github/workflows/,
# because GitHub resolves `uses:` before any step can read this file.
#
# Bumping a pin: edit this file in a pull request. Recompute a checksum with
# `mt toolchain hash <url>`. Changing [llvm].major or [rust.bitcode].version
# needs a new PROJECT.md decision line with matching tokens (CONTEXT D-21).
schema_version = 1

[image]
platform = "linux/amd64"
base = "debian:bookworm-20261005-slim"
# Digest of the multi-arch index; the platform flag selects amd64 from it.
base_digest = "sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587"
snapshot_timestamp = "20261005T000000Z"
source_date_epoch = "1791158400"
tool_path = "/usr/lib/llvm-16/bin:/opt/klee/bin:/opt/cargo-tools/bin:/opt/arm-gnu-toolchain/bin:/opt/cargo/bin:/usr/local/bin:/usr/bin:/bin"
dpkg_query = "/usr/bin/dpkg-query"

# One LLVM major for clang, KLEE, c2rust and llvm-config. Provisional until the
# Phase 6 R1 verdict; recorded as PROJECT.md decision D-15.
[llvm]
major = 16
max_major = 19
status = "provisional"
decision = "D-15"

[rust]
rustup_home = "/opt/rustup"
cargo_home = "/opt/cargo"
host = "x86_64-unknown-linux-gnu"

# Builds the tool and the no_std crates; must equal rust-toolchain.toml.
[rust.tool]
version = "1.99.0"
commit = "b940084d7eb6a299eb4bfeb8e34901bc051e7ac4"
channel_manifest_sha256 = "ce6dddc886364f8d786514771212cebe9b731ba82d6b859951c6b0ccc516b6a2"
components = ["clippy", "rustfmt"]
targets = ["thumbv7em-none-eabihf", "x86_64-unknown-linux-musl"]

# Emits bitcode for KLEE: its LLVM (16.0.5) must match the C-side LLVM major
# and be at most 19. Provisional with the LLVM pin (decision D-15).
[rust.bitcode]
version = "1.72.1"
commit = "d5c2e9c342b358556da91d61ed4133f6f50fc0c3"
llvm = "16.0.5"
channel_manifest_sha256 = "77113b9660855a5ab49e5ff029c998be93fdcea41b062b40420675cf1f4ea229"
decision = "D-15"

[source.arm_gnu]
kind = "archive"
version = "14.3.rel1"
url = "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"
sha256 = "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd"

[source.c2rust]
kind = "crate"
name = "c2rust"
version = "0.22.1"
sha256 = "e331f411600da65f3ed67033048cf1fcc203d7655974cf5bd6410da8bc653f3b"

[source.cargo_mutants]
kind = "crate"
name = "cargo-mutants"
version = "27.1.0"
sha256 = "07072e7bcdeb425d5e5fdbfd9f15a2c749e23cb2edf5ef40aee5876760ae1cf9"

[source.klee]
kind = "git"
url = "https://github.com/klee/klee"
tag = "v3.2"
commit = "92ee8201a050184aacaaeef645ade491f5c93c41"

[source.klee_uclibc]
kind = "git"
url = "https://github.com/klee/klee-uclibc"
tag = "klee_uclibc_v1.4"
commit = "955d502cc1f0688e82348304b053ad787056c754"

[source.rustup]
kind = "archive"
version = "1.29.1"
url = "https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init"
sha256 = "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"

# Fetched by the c2rust build itself; recorded so the manifest names it.
[source.tinycbor]
kind = "transitive"
parent = "c2rust"
commit = "d393c16f3eb30d0c47e6f9d92db62272f0ec4dc7"

# Exact candidate versions at the pinned snapshot timestamp, taken from the
# pin-discovery workflow annotation of the run for commit 6916bb2 and re-checked
# live by `mt toolchain check`. The package list is the one pin-discovery.yml
# resolves (tool_03_discovery_package_list_matches_apt_pins).
[apt]
"bear" = "3.1.1-1"
"clang-16" = "1:16.0.6-15~deb12u1"
"libclang-16-dev" = "1:16.0.6-15~deb12u1"
"libclang-cpp16-dev" = "1:16.0.6-15~deb12u1"
"libz3-4" = "4.8.12-3.1"
"llvm-16" = "1:16.0.6-15~deb12u1"
"llvm-16-dev" = "1:16.0.6-15~deb12u1"
"qemu-system-arm" = "1:7.2+dfsg-7+deb12u18+b3"
"qemu-user" = "1:7.2+dfsg-7+deb12u18+b3"

[ci]
cargo_deny_version = "0.20.2"
buildkit_image = "moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c"

[tool.arm_gcc]
bin = "/opt/arm-gnu-toolchain/bin/arm-none-eabi-gcc"
version_args = ["--version"]
version_regex = 'Arm GNU Toolchain (?P<version>\d+\.\d+\.Rel\d+)'
expect = "14.3.Rel1"

[tool.bear]
bin = "/usr/bin/bear"
version_args = ["--version"]
version_regex = 'bear (?P<version>\d+\.\d+\.\d+)'
expect = "3.1.1"

[tool.c2rust]
bin = "/opt/cargo-tools/bin/c2rust"
version_args = ["--version"]
version_regex = 'c2rust (?P<version>\d+\.\d+\.\d+)'
expect = "0.22.1"

# c2rust links libclang-cpp or libLLVM dynamically; ldd shows which major.
[tool.c2rust.llvm]
source = "probe"
argv = ["/usr/bin/ldd", "/opt/cargo-tools/bin/c2rust"]
regex = 'lib(?:clang-cpp\.so\.|LLVM-)(?P<major>\d+)'

# `cargo mutants --version` is the only working spelling (Pitfall 8).
[tool.cargo_mutants]
bin = "/opt/cargo/bin/cargo"
version_args = ["mutants", "--version"]
version_regex = 'cargo-mutants (?P<version>\S+)'
expect = "27.1.0"

[tool.cargo_mutants.env]
CARGO_HOME = "/opt/cargo"
RUSTUP_HOME = "/opt/rustup"

# The expected version is the upstream part of the clang-16 Debian version.
[tool.clang]
bin = "/usr/lib/llvm-16/bin/clang"
version_args = ["--version"]
version_regex = 'clang version (?P<version>\d+\.\d+\.\d+)'
expect = "16.0.6"

[tool.clang.llvm]
source = "version"

[tool.hayroll]
status = "not_installed"
reason = "licence unconfirmed (risk R3); adapter gated in Phase 8"

[tool.kani]
status = "not_installed"
reason = "Kani evidence deferred to milestone v2.0; R2 spike in Phase 6"

[tool.klee]
bin = "/opt/klee/bin/klee"
version_args = ["--version"]
version_regex = '(?m)^KLEE (?P<version>\d+\.\d+)'
expect = "3.2"

[tool.klee.llvm]
source = "output"
regex = '(?m)LLVM version (?P<major>\d+)\.\d+\.\d+'

[tool.llvm_config]
bin = "/usr/lib/llvm-16/bin/llvm-config"
version_args = ["--version"]
version_regex = '^(?P<version>\d+\.\d+\.\d+)'
expect = "16.0.6"

[tool.llvm_config.llvm]
source = "version"

# Both QEMU binaries are installed: user mode cannot run bare-metal Cortex-M
# images (RESEARCH correction 1, CONTEXT D-11). The expected version is the full
# Debian package version the banner prints.
[tool.qemu_arm]
bin = "/usr/bin/qemu-arm"
version_args = ["--version"]
version_regex = '\(Debian (?P<version>[^)]+)\)'
expect = "1:7.2+dfsg-7+deb12u18+b3"

[tool.qemu_system_arm]
bin = "/usr/bin/qemu-system-arm"
version_args = ["--version"]
version_regex = '\(Debian (?P<version>[^)]+)\)'
expect = "1:7.2+dfsg-7+deb12u18+b3"

[tool.rustup]
bin = "/opt/cargo/bin/rustup"
version_args = ["--version"]
version_regex = '(?m)^rustup (?P<version>\d+\.\d+\.\d+)'
expect = "1.29.1"

[tool.rustup.env]
RUSTUP_HOME = "/opt/rustup"
