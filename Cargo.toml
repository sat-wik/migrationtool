[workspace]
resolver = "3"
members = ["crates/mt-toolchain", "crates/mt-capture", "crates/mt-cli", "crates/mt-seeds"]
# The no_std smoke crate (plan 01-04) is its own workspace root and must never
# become part of the tool workspace.
exclude = ["container/smoke"]

[workspace.package]
edition = "2024"
version = "0.1.0"
# No licence field: the project licence is a founder decision, and cargo-deny
# ignores private crates.
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Read-only, bounds-checked ELF parsing for object section digests (Apache-2.0 OR MIT).
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
regex = "1.13.1"
# Already locked through tempfile; linux_raw backend on Linux (no libc), the
# libc backend on other unix. Used only by runner.rs to signal the child's group
# and, on Linux, escaped descendants.
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Splits CMake `command` strings into argv without a shell (MIT OR Apache-2.0).
shlex = "=2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "=1.1.7"
# Reads zip members (fuzz corpora) in memory (MIT). Deflate only, inflated by
# miniz_oxide, which forbids unsafe code (G-02-4). Not all of the stack is safe
# Rust: zip's header parsing, flate2's buffer code and simd-adler32's SIMD
# intrinsics contain unsafe code. No C code and no other codecs: no bzip2, zstd,
# lzma or encryption features.
zip = { version = "=9.0.2", default-features = false, features = ["deflate-flate2"] }
# Named only to select flate2's rust_backend (miniz_oxide) for zip: zip's
# deflate-flate2 feature leaves the backend open, and flate2 does not compile
# without one. Features unify across the workspace, so mt-seeds naming it here
# picks the safe-Rust inflater (G-02-4).
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }

[workspace.lints.clippy]
# building-the-tool.md section 4: no unwrap/expect outside tests. A justified
# exception carries an allow attribute plus a comment stating the invariant.
unwrap_used = "deny"
expect_used = "deny"
