[[dropped]]
target = "isotp"
entry = "isotp_on_can_message"
cause = "link_unresolved"
detail = "isotp.c calls three functions the library leaves to the user (isotp_user.h): isotp_user_debug, isotp_user_get_ms and isotp_user_send_can; no captured object defines them, and the driver may not define them (no per-target C, D-11), so the driver cannot link: isotp_user_debug, isotp_user_get_ms, isotp_user_send_can"
attempt = "designed the roles (state link, in_buf, in_len with max = 8, two 64-byte uint8_t locals, the setup call isotp_init_link(&link, 1, &sendbuf, 64, &recvbuf, 64)) and checked the link without declaring them: isotp.c compiled with the pinned flags and listed with arm-none-eabi-nm -u shows the three hooks undefined (the capture of isotp exists only in the image, so the pair itself was not linked); the roles were not committed because a declared entry that does not link makes the driver-build step of the image fail and skips every later vectors step"

[[dropped]]
target = "zlib"
entry = "inflate"
cause = "not_expressible"
detail = "inflate needs a stream made by inflateInit_(strm, version, stream_size), whose version argument is the string \"1.3.2\" (ZLIB_VERSION); the setup grammar has no string-literal argument and no allowed form reaches it: string-literal setup argument"
attempt = "read zlib.h and inflate.c at the pinned commit: inflateInit and inflateInit2 are macros over inflateInit_ and inflateInit2_, which return Z_VERSION_ERROR unless version is non-NULL and version[0] == ZLIB_VERSION[0]; inflateReset and inflateReset2 return Z_STREAM_ERROR on a stream without state (inflateStateCheck); sizeof(<local>) covers the stream_size argument but not the version, a NULL or input-derived version fails the check, and an object whose bytes spell the digit would need an integer assigned to a pointer member, which GCC 14 refuses; no form of the allowed list was found that reaches the string, none was added (D-24)"

