# ---------------------------------------------------------------------------
# 15. lz4: decompression, lib/ only (the rest of the repository is GPL).
# ---------------------------------------------------------------------------
[target.lz4]
category = ["compression"]
build = "make"

[target.lz4.source]
kind = "git"
url = "https://github.com/lz4/lz4"
ref = "v1.10.0"
commit = "ebb370ca83af193212df4dcbadcc5d87bc0de2f0"
tree_sha256 = "8def842ac8ebd5d80ddd31f00ddb3bb156edf5d7980dbcde5c734ac7a2f57ca7"

[target.lz4.licence]
spdx = "BSD-2-Clause"
elected = "BSD-2-Clause"
file = "lib/LICENSE"
note = "only lib/ is BSD-2-Clause; the rest of the repository is GPL-2.0-or-later"

# The Makefile has -O3 before the user's CFLAGS, so CFLAGS=-Os restores size.
[target.lz4.build_args]
dir = "lib"
goals = ["liblz4.a"]
make_vars = ["CC={cc} {cflags}", "CFLAGS=-Os"]

[[target.lz4.entry]]
name = "LZ4_decompress_safe"
header = "lib/lz4.h"
source = "lib/lz4.c"
form = "direct"
signature = "int (const char *, char *, int, int)"
# Argument roles (Phase 3 CONTEXT D-11): source, destination, compressed size and
# destination capacity, in parameter order. The destination is prefilled with the
# sentinel and recorded whole after the call, partial writes on the error path
# included (D-07). The capacity is swept (D-14): 256 first, a small 16 that makes
# a longer block fail part-way, and 4096 that leaves a long tail of sentinel.
[[target.lz4.entry.arg]]
role = "in_buf"

[[target.lz4.entry.arg]]
role = "out_buf"

[[target.lz4.entry.arg]]
role = "in_len"

[[target.lz4.entry.arg]]
role = "out_cap"
default = 256
sweep = [16, 4096]

[[target.lz4.entry]]
name = "LZ4F_getFrameInfo"
header = "lib/lz4frame.h"
source = "lib/lz4frame.c"
form = "direct"
signature = "size_t (LZ4F_dctx *, LZ4F_frameInfo_t *, const void *, size_t *)"

[[target.lz4.config]]
name = "default"

[[target.lz4.config]]
name = "heap-small"
defines = ["LZ4_HEAPMODE=1", "LZ4_MEMORY_USAGE=10"]

# Seeds (BUILD-03): none may be taken. Test data outside lib/ is GPL-2.0-or-later
# (RESEARCH Pitfall 18), so the seeds are hand-made (testbed/targets/lz4/hand-made).

