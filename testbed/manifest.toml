[[target.nimble.entry]]
name = "ble_hs_adv_parse_fields"
header = "nimble/host/include/host/ble_hs_adv.h"
source = "nimble/host/src/ble_hs_adv.c"
form = "direct"
signature = "int (struct ble_hs_adv_fields *, const uint8_t *, uint8_t)"

[[target.nimble.entry]]
name = "ble_uuid_init_from_buf"
header = "nimble/host/include/host/ble_uuid.h"
source = "nimble/host/src/ble_uuid.c"
form = "direct"
signature = "int (ble_uuid_any_t *, const void *, size_t)"

# Argument roles (Phase 3 CONTEXT D-09, D-11): the UUID is a state, a union that is
# zero-filled in its own guarded mapping and recorded with every member decoded
# from the same bytes before and after the call; the buffer is the input bytes
# and the size_t their length.
[[target.nimble.entry.arg]]
role = "state"
name = "uuid"

[[target.nimble.entry.arg]]
role = "in_buf"

[[target.nimble.entry.arg]]
role = "in_len"

[[target.nimble.config]]
name = "default"

[[target.nimble.config]]
name = "peripheral"
defines = ["MYNEWT_VAL_BLE_ROLE_OBSERVER=0", "MYNEWT_VAL_BLE_ROLE_CENTRAL=0"]

# Seeds (BUILD-03): the advertisement and attribute byte arrays of the host tests.
[[target.nimble.seed_source]]
path = "nimble/host/test/src"
methods = ["c_array"]
entries = ["ble_hs_adv_parse_fields", "ble_uuid_init_from_buf"]

# ---------------------------------------------------------------------------
# 12. libfdt: stands in for the OTA image header (a FIT image is a devicetree
# blob, D-29). Only libfdt is dual-licensed; dtc and its tests are GPL.
# fdt_check_header is omitted: it takes no length, so it is not a D-24 entry.
# ---------------------------------------------------------------------------
[target.libfdt]
category = ["ota_header", "tlv"]
build = "make"

[target.libfdt.source]
kind = "git"
url = "https://github.com/dgibson/dtc"
ref = "v1.8.1"
commit = "8f48565e5cfedc74d3f7512f1e0188e9d85dc1de"
tree_sha256 = "f844d15ee31ac3a97fdecce950e50472a4f7a889c2e4e1b678bf9f26dc21b313"

[target.libfdt.licence]
spdx = "GPL-2.0-or-later OR BSD-2-Clause"
elected = "BSD-2-Clause"
file = "BSD-2-Clause"
note = "only libfdt is dual-licensed; dtc itself and tests/ are GPL; see README.license"

# libfdt/libfdt.a, not the libfdt goal (which links a shared library).
[target.libfdt.build_args]
dir = "."
goals = ["libfdt/libfdt.a"]
make_vars = ["CC={cc} {cflags}", "NO_PYTHON=1", "NO_YAML=1"]

[[target.libfdt.entry]]
name = "fdt_check_full"
header = "libfdt/libfdt.h"
source = "libfdt/fdt_check.c"
form = "direct"
signature = "int (const void *, size_t)"
# Argument roles (Phase 3 CONTEXT D-11): the blob and its size. fdt_check_full
# writes nothing, so there is no output buffer and no scalar to sweep (D-14).
[[target.libfdt.entry.arg]]
role = "in_buf"

[[target.libfdt.entry.arg]]
role = "in_len"

[[target.libfdt.config]]
name = "default"

[[target.libfdt.config]]
name = "assume-valid"
make_vars = ["ASSUME_MASK=0xff"]

# Seeds (BUILD-03): none that may be taken. The repository ships devicetree
# sources, not blobs, and its tests directory is GPL; the seeds are hand-made
# (testbed/targets/libfdt/hand-made).

