# Seeds (BUILD-03): none taken. test/example.c holds error messages and test/
# infcover.c holds its inflate streams as hex text inside C strings, so a string
# extraction would yield the ASCII of those messages, not zlib streams. The seeds
# are hand-made streams (testbed/targets/zlib/hand-made).
