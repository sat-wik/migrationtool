header = "include/zcbor_decode.h"
source = "src/zcbor_decode.c"
form = "direct"
signature = "void (zcbor_state_t *, size_t, const uint8_t *, size_t, size_t, uint8_t *, size_t)"

[[target.zcbor.config]]
name = "default"

[[target.zcbor.config]]
name = "stop-on-error"
defines = ["ZCBOR_STOP_ON_ERROR"]

# Seeds (BUILD-03): the SUIT and corner-case examples as hex text, and the byte
