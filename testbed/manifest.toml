# 13. httpparser: HTTP, widely embedded. Its Makefile appends -O3 after the
# baseline; the optimisation gate records that and does not fail it (Open
# Question 7).
# ---------------------------------------------------------------------------
[target.httpparser]
category = ["http"]
build = "make"

[target.httpparser.source]
kind = "git"
url = "https://github.com/nodejs/http-parser"
