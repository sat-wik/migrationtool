# Seeds (BUILD-03, G-02-3): the constant byte arrays of the test files whose arrays are
# CBOR encodings: qcbor_decode_tests.c (inputs to decode), qcbor_encode_tests.c (the
# expected encodings, which are valid CBOR; a few small payload blobs that the tests
# encode into byte strings are swept in with them), not_well_formed_cbor.h (the
# not-well-formed inputs) and float_tests.c (expected float encodings). No string
# source remains: the strings of the tests are labels such as "another int" and
# " tests failed". UsefulBuf_Tests.c (buffer utility tests, arrays of '+' and
# "Boo") and run_tests.c (the runner) are left out because they hold no CBOR.
[[target.qcbor.seed_source]]
path = "test/qcbor_decode_tests.c"
methods = ["c_array"]
entries = ["QCBORDecode_Init"]

[[target.qcbor.seed_source]]
path = "test/qcbor_encode_tests.c"
methods = ["c_array"]
entries = ["QCBORDecode_Init"]

[[target.qcbor.seed_source]]
path = "test/not_well_formed_cbor.h"
methods = ["c_array"]
entries = ["QCBORDecode_Init"]

[[target.qcbor.seed_source]]
path = "test/float_tests.c"
methods = ["c_array"]
entries = ["QCBORDecode_Init"]

# ---------------------------------------------------------------------------
# 4. nanopb: Protocol Buffers for microcontrollers (spec example).
# ---------------------------------------------------------------------------
[target.nanopb]
category = ["protobuf"]
build = "cmake"

[target.nanopb.source]
kind = "git"
url = "https://github.com/nanopb/nanopb"
ref = "nanopb-0.4.9.2"
commit = "160d4f09e5fabb2b66aa2dea32d4f38ace2c4b3f"
tree_sha256 = "b86f61ac9e874160f9f405412d131d3522c2e9b536a582b8581158ee9520b6ce"

[target.nanopb.licence]
spdx = "Zlib"
elected = "Zlib"
file = "LICENSE.txt"

# CMake looks for protoc at configure time even with the generator off, so protoc
# is pointed at /usr/bin/true (coreutils); only the static runtime library is built.
[target.nanopb.build_args]
dir = "."
cmake_target = "protobuf-nanopb-static"
cmake_options = ["-Dnanopb_PROTOC_PATH=/usr/bin/true", "-Dnanopb_BUILD_GENERATOR=OFF"]

[[target.nanopb.entry]]
name = "pb_istream_from_buffer"
header = "pb_decode.h"
source = "pb_decode.c"
form = "direct"
signature = "pb_istream_t (const pb_byte_t *, size_t)"

[[target.nanopb.entry]]
name = "pb_decode_ex"
header = "pb_decode.h"
source = "pb_decode.c"
form = "wrapped"
signature = "_Bool (pb_istream_t *, const pb_msgdesc_t *, void *, unsigned int)"
accepted_wrapped = true

[[target.nanopb.config]]
name = "default"

[[target.nanopb.config]]
name = "buffer-only"
defines = ["PB_BUFFER_ONLY=1", "PB_NO_ERRMSG=1"]

# Seeds (BUILD-03, G-02-3): the fuzz test's sample messages and its fuzz corpora
# (corpus.zip, regressions.zip), which are the protobuf inputs of nanopb. There is
# no string source: the strings under tests/ are test names, messages, malloc
# wrappers and platform vectors. An archive above 2 MiB is not opened.
[[target.nanopb.seed_source]]
path = "tests/fuzztest/sample_data"
methods = ["file_copy"]
extensions = ["pb"]
entries = ["pb_decode_ex", "pb_istream_from_buffer"]

[[target.nanopb.seed_source]]
path = "tests/fuzztest"
methods = ["zip_member"]
extensions = ["zip"]
entries = ["pb_decode_ex", "pb_istream_from_buffer"]

