commit = "2343fd6b5214b2ded2cdcf76de2bf60903bb90cd"
tree_sha256 = "03f91004dd3d60a8b7ada8106d16b3ec6976006f208b216a3f630434436a68a6"

[target.httpparser.licence]
spdx = "MIT"
elected = "MIT"
file = "LICENSE-MIT"

# The Makefile appends -O3 after the caller's flags: recorded by the optimisation
# gate, not failed.
[target.httpparser.build_args]
dir = "."
goals = ["libhttp_parser.o"]
make_vars = ["CC={cc} {cflags}"]

[[target.httpparser.entry]]
name = "http_parser_execute"
header = "http_parser.h"
source = "http_parser.c"
form = "direct"
signature = "size_t (http_parser *, const http_parser_settings *, const char *, size_t)"

[[target.httpparser.entry]]
name = "http_parser_parse_url"
header = "http_parser.h"
source = "http_parser.c"
form = "direct"
signature = "int (const char *, size_t, int, struct http_parser_url *)"

[[target.httpparser.config]]
name = "default"

[[target.httpparser.config]]
name = "strict"
make_vars = ["CPPFLAGS_FAST=-I. -DHTTP_PARSER_STRICT=1"]

# Seeds (BUILD-03, G-02-3): the `.raw` members of the requests[] and responses[]
# arrays of test.c are the HTTP messages its tests feed to http_parser_execute. The
# rest of the file's strings are message names, header fields, bodies, the URLs of
# url_tests[] (http_parser_parse_url, not an entry) and printf messages.
[[target.httpparser.seed_source]]
path = "test.c"
methods = ["c_string"]
designators = ["raw"]
entries = ["http_parser_execute"]

