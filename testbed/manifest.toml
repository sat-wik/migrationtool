# ---------------------------------------------------------------------------
# 6. corejson: allocation-free JSON. Tracer target (CMake).
# ---------------------------------------------------------------------------
[target.corejson]
category = ["json"]
build = "cmake"

[target.corejson.source]
kind = "git"
url = "https://github.com/FreeRTOS/coreJSON"
ref = "v3.3.1"
commit = "cffa492da18c890181d64462f8af63992a69d3b0"
tree_sha256 = "9ca1058329f6ce0c31f9c13f861ec20cf75f35230b9aae0122ab81480a6df9a5"

[target.corejson.licence]
spdx = "MIT"
elected = "MIT"
file = "LICENSE"

[target.corejson.build_args]
dir = "."
