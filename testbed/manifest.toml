[[target.corejson.config]]
name = "default"

[[target.corejson.config]]
name = "depth-8"
defines = ["JSON_MAX_DEPTH=8"]

# Seeds (BUILD-03): the string literals of the unit tests. The repository's
# .clusterfuzzlite directory holds no corpus files at this commit.
[[target.corejson.seed_source]]
path = "test/unit-test"
methods = ["c_string"]
extensions = ["c"]
entries = ["JSON_SearchT", "JSON_Validate"]

