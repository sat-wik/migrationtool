# ---------------------------------------------------------------------------
# 8. paho: Eclipse embedded MQTT packet library. Dual-licensed (D-27).
# ---------------------------------------------------------------------------
[target.paho]
category = ["mqtt"]
build = "cmake"

[target.paho.source]
kind = "git"
url = "https://github.com/eclipse-paho/paho.mqtt.embedded-c"
ref = "master"
commit = "6035ea2d4922bb7558b444fb2a051743f3f1974b"
tree_sha256 = "a69bce85a45e561bdf490f80b35ddae7d13eb04a67c9b59fb070a2593286320b"

[target.paho.licence]
spdx = "EPL-2.0 OR BSD-3-Clause"
elected = "BSD-3-Clause"
file = "edl-v10"
note = "EDL-1.0 is the BSD-3-Clause text, elected here; the repository also ships LICENSE and epl-v20"

# The top-level CMake also enables C++ and exports the C++ client's compile
# commands, which the compiler allow-list refuses, so the C-only MQTTPacket
# project is the source directory (it is the project's own CMake build). Its
# libraries are SHARED, which falls back to static on the Generic system.
[target.paho.build_args]
dir = "MQTTPacket"
cmake_target = "MQTTPacketClient"

# The declaring headers (MQTTPublish.h, MQTTConnect.h) use MQTTString without
# including its definition, so they do not compile alone; MQTTPacket.h is the public
# header that includes them and declares the types first.
[[target.paho.entry]]
name = "MQTTDeserialize_publish"
header = "MQTTPacket/src/MQTTPacket.h"
source = "MQTTPacket/src/MQTTDeserializePublish.c"
form = "direct"
signature = "int (unsigned char *, int *, unsigned char *, unsigned short *, MQTTString *, unsigned char **, int *, unsigned char *, int)"

[[target.paho.entry]]
name = "MQTTDeserialize_connack"
header = "MQTTPacket/src/MQTTPacket.h"
source = "MQTTPacket/src/MQTTConnectClient.c"
form = "direct"
signature = "int (unsigned char *, unsigned char *, unsigned char *, int)"

[[target.paho.config]]
name = "default"

[[target.paho.config]]
name = "server"
cmake_target = "MQTTPacketServer"

# Seeds (BUILD-03): none. MQTTPacket/test/test1.c only round-trips packets it
# builds itself, so the seeds are hand-made (testbed/targets/paho/hand-made).

