# The committed test bed: 16 open-source C parsers whose real builds are captured
# and replayed (BED-01, BED-02). Phase 2 CONTEXT D-03: the founder approved this
# exact list as proposed, with no edits, before this file existed; the approval
# (target_list_approval: approve-as-proposed, drop_granularity: variant) is
# recorded in .planning/phases/02-test-bed-and-build-capture/02-03-SUMMARY.md.
#
# Pins (D-17): every source is fixed by a 40-hex commit and a 64-hex tree_sha256
# (the algorithm of crates/mt-capture/src/treehash.rs; `.git` excluded). The
# values come from 02-RESEARCH.md "Appendix: manifest-ready pins"; the CI fetch
# in plans 02-06 and 02-09 is what checks them against the real repositories.
# Mbed TLS is an archive source (D-20, PROJECT.md D-20): pinned by archive sha256
# plus tree sha256, with the commit of the tag kept for provenance only.
#
# Licences (D-02, D-27, PROJECT.md D-19): `spdx` is the upstream expression,
# `elected` the permissive operand this project uses, `file` the licence file at
# the pinned commit. Nothing here is a legal opinion.
#
# Recipes (D-03): only the two tracer targets, qcbor (Make) and corejson (CMake),
# carry a build recipe table. The other recipes are written in plan 02-09
# after the tracer is green.
#
# Placeholders allowed in build strings (D-20): {cc} the pinned arm-none-eabi-gcc,
# {cflags} baseline then the configuration's defines and cflags, {src} the source
# root of the run, {inputs} the directory of committed files under
# testbed/targets/<id>/.
schema_version = 1

[decisions]
# D-08 / PROJECT.md D-18: parsers are RTOS-independent, so the choice is deferred.
first_rtos = "deferred"
first_rtos_reason = "parsers are RTOS-independent; revisit after the design-partner interviews (weeks 4-10)"
first_rtos_candidates = ["freertos", "zephyr"]
project_decision = "D-18"

[image]
# The toolchain image every capture and replay runs in (D-10). The same digest is
# under "Current image" in container/README.md; a test keeps the two equal.
digest = "sha256:e83006c0a7e37f788afcbd1c95554e8c4dfc61c3b68da3ff964caf47fb3851b9"

[baseline]
# D-06: Cortex-M4F with hardware floating point, optimised for size.
cflags = ["-mcpu=cortex-m4", "-mthumb", "-mfloat-abi=hard", "-mfpu=fpv4-sp-d16", "-Os"]

[seed_caps]
# D-16: the caps every target's seed corpus is selected under (RESEARCH "Caps and
# selection"). Each limit is inclusive and above zero.
max_seeds = 200
max_total_bytes = 1048576
max_seed_bytes = 65536

# ---------------------------------------------------------------------------
# 1. tinycbor: CBOR (spec example). CMake only at v7.0.
# ---------------------------------------------------------------------------
[target.tinycbor]
category = ["cbor"]
build = "cmake"

[target.tinycbor.source]
kind = "git"
url = "https://github.com/intel/tinycbor"
ref = "v7.0"
commit = "6442e749ca811e24afad1551338a45c75e09808f"
tree_sha256 = "9acf217a3877140b998586cc8c4172e28bfe90630938344e3cc6067a35b86189"

[target.tinycbor.licence]
spdx = "MIT"
elected = "MIT"
file = "LICENSE"

[[target.tinycbor.entry]]
name = "cbor_parser_init"
header = "src/cbor.h"
source = "src/cborparser.c"
form = "direct"
signature = "CborError (const uint8_t *, size_t, uint32_t, CborParser *, CborValue *)"

[[target.tinycbor.entry]]
name = "cbor_value_validate"
header = "src/cbor.h"
source = "src/cborvalidation.c"
form = "wrapped"
signature = "CborError (const CborValue *, uint32_t)"
accepted_wrapped = true

[[target.tinycbor.config]]
name = "default"

[[target.tinycbor.config]]
name = "no-float"
cmake_options = ["-DWITH_FLOATING_POINT=OFF"]

